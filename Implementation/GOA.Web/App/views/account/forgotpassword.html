<div id="forgotpassword">
    <div class="container">
        <div class="page-header mart5">
            <h1 class="text-center">Enter your mail   <br /><small class="mart5">We will send you an email with the instructions for resetting your password.</small></h1>
        </div>
        <div class="row">
            <div class="col-lg-4"></div>
            <div class="col-lg-4">
                <form data-bind="submit : forgotPassword" >
                    <div class="form-group" data-bind="validationElement: email">                        
                        <input class="form-control" type="text" data-bind="value: email" placeholder="Email">                        
                    </div>
                    <button type="submit" class="btn btn-primary">Start the process</button>
                    <button type="reset" class="btn btn-warning"><i class="fa fa-refresh"></i> &nbsp;&nbsp;Reset</button>
                    <a href="account/login" class="btn btn-success"><i class="fa fa-arrow-circle-o-left"></i> &nbsp;&nbsp;Back </a>
                </form>
            </div>
            <div class="col-lg-3"></div>
        </div>
        <hr />
    </div>
</div>
