
<div>
    <div class="register-box">
        <div class="register-logo">
            <a href=""><b>EDGE</b>GOA</a>
        </div>
        <div class="register-box-body">
            <p class="login-box-msg">Register a new membership</p>
            <form data-bind="submit : register">

                <div class="form-group has-feedback" data-bind="validationElement: username">
                    <input type="text" class="form-control" data-bind="value: username" placeholder="User name" />
                    <span class="glyphicon glyphicon-user form-control-feedback"></span>
                </div>

                <div class="form-group has-feedback" data-bind="validationElement: email">
                    <input type="email" class="form-control" data-bind="value: email" placeholder="Email" />
                    <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
                </div>

                <div class="form-group has-feedback" data-bind="validationElement: password">
                    <input type="password" class="form-control" data-bind="value: password" placeholder="Password" />
                    <span class="glyphicon glyphicon-lock form-control-feedback"></span>
                </div>

                <div class="form-group has-feedback" data-bind="validationElement: confirmpassword">
                    <input type="password" class="form-control" data-bind="value: confirmpassword" placeholder="Retype password" />
                    <span class="glyphicon glyphicon-log-in form-control-feedback"></span>
                </div>
                <div class="row">
                    <div class="col-xs-8">
                        <div class="checkbox icheck">
                            <label>
                                <input type="checkbox" id="checkboxTerm" /> &nbsp; I agree to the <a href="#" data-bind="click: showTermsModel">terms</a>
                            </label>
                        </div>
                    </div><!-- /.col -->
                    <div class="col-xs-4">
                        <button type="submit" data-bind="enable:agreeTerms" class="btn btn-primary btn-block btn-flat">Register</button>
                        
                    </div><!-- /.col -->
                </div>
            </form>
            <div class="social-auth-links text-center">
                <p>- OR -</p>
                <a href="#" class="btn btn-block btn-social btn-facebook btn-flat disabled"><i class="fa fa-facebook"></i> Sign up using Facebook</a>
                <a href="#" class="btn btn-block btn-social btn-google-plus btn-flat disabled"><i class="fa fa-google-plus"></i> Sign up using Google+</a>
                <a href="#" class="btn btn-block btn-social btn-twitter btn-flat disabled"><i class="fa fa-twitter"></i> Sign up using Twitter</a>
            </div>
            <a href="account/login" class="text-center">I already have a membership</a>
        </div><!-- /.form-box -->
    </div><!-- /.register-box -->
    <div class="modal fade" id="termsModel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" data-bind="click: $root.closeTermsModel">&times;</button>
                    <h1 class="modal-title" data-bind="text: 'Terms & Conditions'"></h1>
                </div>
                <div class="modal-body">
                    <div class="row mart2">
                        <div class="col-lg-12">
                            <span>This portion is under development yet.</span>
                            <!--<input type="text" class="form-control input-sm" placeholder="Template Name" data-bind="value:$root.templateName" />-->
                        </div>

                    </div>

                </div>
                <div class="modal-footer">
                    <!--<button type="button" class="btn btn-success" data-bind="click: $root.closeTermsModel">Okay</button>-->
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-bind="click: $root.closeTermsModel">Close</button>
                </div>
            </div>
        </div>
    </div>

</div>
