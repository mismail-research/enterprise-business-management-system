    </style>
    <section class="content-header">
        <h1>Product
            <small class="text-danger">(Ensure you fill in all fields correctly)</small>
        </h1>

            <li><a href=""><i class="fa fa-dashboard"></i>Home</a></li>
            <li><a href=""><i class="fa fa-bars"></i>Products</a></li>
            <li class="active">Product</li>
        </ol>
    </section>

                            <h3 class="box-title">Product Details</h3>
                        </div>

                            <div class="col-lg-12">
                                <div class="row form-group">
                                    <div class="col-lg-2">
                                        <label for="" class="text-danger">Product Id</label>
                                    </div>
                                    <div class="col-lg-4" data-bind="validationElement: productNo">
                                        <input id="Text1" type="text" class="form-control input-sm" placeholder="Product Number" data-bind=" value:productNo,enable: $root.mode() != 'view'" />
                                    </div>
                                    <div class="col-lg-2">
                                        <label for="" class="text-danger">Product Name</label>
                                    </div>
                                    <div class="col-lg-4" data-bind="validationElement: productName">
                                        <input id="Text2" type="text" class="form-control input-sm" placeholder="Product Name" data-bind=" value:productName, enable: $root.mode() != 'view'" />
                                    </div>
                                </div>

                                <div class="row form-group">
                                    <div class="col-lg-2">
                                        <label for="" class="text-danger">Commodity Code</label>
                                    </div>
                                    <div class="col-lg-4" data-bind="validationElement: commodityCode">
                                        <input id="commCode" type="text" class="form-control input-sm" placeholder="Commodity Code" data-bind="value:commodityCode, enable: $root.mode() != 'view'" />
                                    </div>
                                    <div class="col-lg-2">
                                        <label for="" class="text-danger">Description</label>
                                    </div>
                                    <div class="col-lg-4" data-bind="validationElement: productDescription">
                                        <input id="desc" type="text" class="form-control input-sm" placeholder="Description" data-bind="value:productDescription, enable: $root.mode() != 'view'" />

                                    </div>
                                </div>

                            </div>
                        </div>
                        <!--End Of box-body-->
