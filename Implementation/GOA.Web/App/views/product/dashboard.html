<!-- Content Header (Page header) -->
<section class="content-header">
    <style>
    </style>

    <h1>Products
    </h1>
    <ol class="breadcrumb">
        <li><a href=""><i class="fa fa-dashboard"></i>Home</a></li>
        <li><a href=""><i class="fa fa-bars"></i>Products</a></li>
        <li class="active">Dashboard</li>
    </ol>
</section>
<!-- Main content -->
<section class="content">
    <div class="row">
        <div class="col-xs-12">
            <div class="box">
                <div class="box-header">
                    <!--<h3 class="box-title">Search Products</h3>-->
                    <div class="col-lg-2" style="padding: 0px;">
                        <button class="btn btn-block btn-info " data-bind="click: addProduct"><i class="fa fa-plus">&nbsp&nbsp</i><strong>New Product</strong></button>
                    </div>
                </div>

                <!-- /.box-header -->
                <div class="box-body">
                    <div class="col-lg-12 table-responsive">
                        <table id="example1" class="table table-bordered table-striped">
                            <thead>
                                <tr>
                                    <th>Product No</th>
                                    <th>Product Name</th>
                                    <th>Comm Code</th>
                                    <th>Last Updated</th>
                                    <th>Top Market</th>
                                    <th>Latest Market</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody data-bind="foreach:products">
                                <tr>
                                    <td data-bind="text:productNo"></td>
                                    <td data-bind="text:productName"></td>
                                    <td data-bind="text:commodityCode"></td>
                                    <td data-bind="text:updatedDate"></td>
                                    <td data-bind="text:topMarket"></td>
                                    <td data-bind="text:latestMarket"></td>
                                    <!--<td><span data-bind="text:status, attr: { class: status }"></span></td>-->
                                    <td>
                                        <a id="A2" class="btn-grid btnmarket" data-bind="click:$root.marketexplorer" title="Market Explorer"></a>
                                        <a id="A20" class="btn-grid btnview" data-bind="click:$root.viewProduct" title="View"></a>
                                        <a id="A21" class="btn-grid btnedit" data-bind="click:$root.editProduct" title="Edit"></a>
                                    </td>

                                </tr>
                            </tbody>

                        </table>
                    </div>
                </div>
                <!-- /.box-body -->
            </div>
            <!-- /.box -->
        </div>
        <!-- /.col -->
    </div>
    <!-- /.row -->
</section>
<!-- /.content -->
