<section class="content-header">
    <h1>
        Update Profile
        <small></small>
    </h1>
    <ol class="breadcrumb">
        <li><a href=""><i class="fa fa-dashboard"></i> Home</a></li>
        <li class="">User</li>
        <li class="active">Profile</li>
    </ol>
</section>
<section class="content">
    <div class="panel panel-default">
        <div class="panel-body">


            <div class="row" data-bind="with:profile">
                <div class="col-lg-3"></div>
                <div class="col-lg-3 text-center">
                    <img alt="Profile Picture" onerror="this.src ='../UploadedImage/default-male-image.png'" data-bind="attr: { src:'../UploadedImage/' + pictureUrl() }" width="120" height="120" id="Content_Img1" src="../UploadedImage/default-male-image.png" style="border:1px;">
                    <br /><br /><button id="btnChangePic" data-bind="click:$root.showPicModel" type="button" class="btn btn-default btn-sm">Change</button>

                </div>
                <div class="col-lg-3">
                    <span class="text-muted">Title:</span>
                    <select class="form-control input-sm" data-bind="value:title">
                        <option>Mr</option>
                        <option>Miss</option>
                        <option>Mrs</option>
                        <option>MS</option>
                    </select>
                    <span class="text-danger">First Name:</span>
                    <input type="text" data-bind="value:firstName" class="form-control input-sm" placeholder="First Name" />
                    <span class="text-danger">Last Name:</span>
                    <input type="text" data-bind="value:lastName" class="form-control input-sm" placeholder="Last Name" />
                    <span class="text-muted">Designation:</span>
                    <input type="text" data-bind="value:designation" class="form-control input-sm" placeholder="Designation" />
                    <span class="text-muted">About you:</span>
                    <textarea type="text" data-bind="value:aboutMe" class="form-control input-sm" placeholder="Brief Decription" />
                    <hr />
                    <button class="btn btn-info btn-sm" data-bind="click:$root.saveProfile">Save</button>
                    <a href="" class="btn btn-danger btn-sm">Cancel</a>

                </div>
                <div class="col-lg-3"></div>

            </div>

            <div class="mart5"></div>
        </div>
    </div>

    <div class="modal fade" id="upload-Picture">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" data-bind="click: $root.closePicModel">&times;</button>
                    <h1 class="modal-title" data-bind="text: 'Upload Picture'"></h1>
                </div>
                <div class="modal-body">

                    <div class="mart5" style="text-align: center;">
                        <input type="file" name="uploadPicture" id="uploadPicture" />

                        <div style="margin-top:10px;">
                            <button class="btn btn-primary btn-sm" data-bind="click:$root.uploadPicture" title="Upload Image to server.">Upload Image</button>
                            <button class="btn btn-danger btn-sm" data-bind="click:$root.closePicModel" title="Cancel Uploading">Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal" data-bind="click: $root.closePicModel">Close</button>
                </div>
            </div>
        </div>
    </div>

</section>
